# Pinned v0.160.0: exporter name is azure_monitor, not azuremonitor.
# See exporter/{azuremonitorexporter,fileexporter} at:
# https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/v0.160.0
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  transform/privacy:
    error_mode: propagate
    trace_statements:
      - context: span
        conditions:
          - resource.attributes["copilot.audit.scenario"] != "full-content" and resource.attributes["copilot.audit.scenario"] != "delegated"
        statements:
          - delete_key(span.attributes, "gen_ai.input.messages")
          - delete_key(span.attributes, "gen_ai.output.messages")
          - delete_key(span.attributes, "gen_ai.system_instructions")
          - delete_key(span.attributes, "gen_ai.tool.definitions")
          - delete_key(span.attributes, "gen_ai.tool.call.arguments")
          - delete_key(span.attributes, "gen_ai.tool.call.result")
      - context: spanevent
        conditions:
          - resource.attributes["copilot.audit.scenario"] != "full-content" and resource.attributes["copilot.audit.scenario"] != "delegated"
        statements:
          - delete_key(spanevent.attributes, "gen_ai.input.messages")
          - delete_key(spanevent.attributes, "gen_ai.output.messages")
          - delete_key(spanevent.attributes, "gen_ai.system_instructions")
          - delete_key(spanevent.attributes, "gen_ai.tool.definitions")
          - delete_key(spanevent.attributes, "gen_ai.tool.call.arguments")
          - delete_key(spanevent.attributes, "gen_ai.tool.call.result")

exporters:
  azure_monitor:
    connection_string: ${env:APPLICATIONINSIGHTS_CONNECTION_STRING}
    spaneventsenabled: true
    shutdown_timeout: 10s
  file:
    path: /evidence/otel.json
    format: json
    # Rotation appends across collector restarts; append:true is incompatible.
    # Precreate otel.json as 0600, mount a 0700 directory, run as the host UID.
    # v0.160.0 rotation creates 0644 files, protected by the 0700 directory.
    # status fails on rotation; stop restores all evidence files to 0600.
    rotation:
      max_megabytes: 10
      max_backups: 2
      max_days: 1
      localtime: false

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: /health

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/privacy]
      exporters: [azure_monitor, file]
    metrics:
      receivers: [otlp]
      exporters: [azure_monitor, file]
